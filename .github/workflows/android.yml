# Compila la app de Android (.aab firmado) para subirla a Google Play.
# Se ejecuta a mano desde la pestaña "Actions" de GitHub → "Compilar app Android" → "Run workflow".
name: Compilar app Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión visible para los usuarios (por ejemplo 1.0, 1.1)"
        required: true
        default: "1.0"
  pull_request:
    paths:
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y copiar el juego a la app
        run: |
          npm ci
          npm run android

      - name: Preparar la llave de firma
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANIMAKID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANIMAKID_KEYSTORE_BASE64 (la llave de firma)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/animakid.keystore"
          echo "ANIMAKID_KEYSTORE=$RUNNER_TEMP/animakid.keystore" >> "$GITHUB_ENV"

      - name: Compilar el .aab
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
          ANIMAKID_KEYSTORE_PASSWORD: ${{ secrets.ANIMAKID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Guardar el .aab para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: animakid-${{ github.event.inputs.version_name || 'prueba' }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
